<!DOCTYPE html>
<html>

<head>
    <title>Admin Dashboard</title>
</head>

<body>
    <h1>🚗 Admin Dashboard</h1>

    <div id="stats"></div>

    <script>
        fetch("/admin/stats")
            .then(res => res.json())
            .then(data => {
                document.getElementById("stats").innerHTML =
                    `Users: ${data.users} | Cars: ${data.cars} | Bookings: ${data.bookings}`;
            });
    </script>
</body>

</html>
