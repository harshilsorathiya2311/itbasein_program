{% extends 'base.html' %}
{% block title %}My Preferences - YourDriveAi{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0">
                <div class="card-body p-4">
                    <h3 class="mb-4">My Preferences</h3>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Min Price</label>
                            <input type="number" name="min_price" class="form-control" value="{{ pref.min_price|default:'' }}" step="0.01">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Max Price</label>
                            <input type="number" name="max_price" class="form-control" value="{{ pref.max_price|default:'' }}" step="0.01">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Fuel Types (comma-separated)</label>
                            <input type="text" name="fuel_types" class="form-control" value="{{ pref.fuel_types }}" placeholder="e.g. Petrol, Electric">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Transmission</label>
                            <select name="transmission" class="form-control">
                                <option value="">Any</option>
                                <option value="Manual" {% if pref.transmission == 'Manual' %}selected{% endif %}>Manual</option>
                                <option value="Automatic" {% if pref.transmission == 'Automatic' %}selected{% endif %}>Automatic</option>
                                <option value="CVT" {% if pref.transmission == 'CVT' %}selected{% endif %}>CVT</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Min Seating</label>
                            <input type="number" name="min_seating" class="form-control" value="{{ pref.min_seating|default:'' }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Max Mileage (kmpl)</label>
                            <input type="number" name="max_mileage" class="form-control" value="{{ pref.max_mileage|default:'' }}" step="0.1">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Save Preferences</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
